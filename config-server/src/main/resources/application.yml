server:
  port: 8888

spring:
  application:
    name: config-server
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

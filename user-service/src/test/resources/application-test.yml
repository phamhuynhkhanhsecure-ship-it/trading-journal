spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/test_user_service
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      # Override explicitly — application.yml sets producer.bootstrap-servers separately
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Override explicitly — application.yml sets consumer.bootstrap-servers separately
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
      auto-offset-reset: earliest
      group-id: test-group
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0

app:
  mongo:
    transactions:
      enabled: false
  security:
    super-admins: superadmin@test.com
  outbox:
    poll-interval: 300

logging:
  level:
    com.conarum.userservice: WARN

spring:
  config:
    import: ""   # Disable Config Server import in tests
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      # Valid URI format required — flapdoodle overrides the actual connection
      # to its embedded instance. Empty string causes URI parse failure.
      uri: mongodb://localhost:27017/test_trading_journal
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: test-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri uses lazy key fetching — never called in tests that use jwt() mock
          # or unauthenticated tests. Avoids startup connection to Google.
          jwk-set-uri: http://test-only-never-called-jwks/keys

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Flapdoodle: MongoDB version to download for embedded instance
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0

# Disable MongoTransactionManager — embedded MongoDB is standalone (no replica set)
app:
  mongo:
    transactions:
      enabled: false
  security:
    super-admins: superadmin@test.com
  outbox:
    poll-interval: 300   # Faster polling in tests

# Stub external API keys
gemini:
  api:
    key: test-key-stub

google:
  drive:
    client-id: test
    client-secret: test
    refresh-token: test
    folder-id: test-folder

logging:
  level:
    com.conarum.tradingjournal: WARN   # Quieter output in tests
